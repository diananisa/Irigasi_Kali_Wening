services:
  db:
    image: postgres:16-alpine
    container_name: irigasi-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-irigasi_kali_wening}
      POSTGRES_USER: ${DB_USER:-irigasi}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-irigasi_dev_password}
    ports:
      - "5434:5432"
    volumes:
      - irigasi_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U irigasi -d irigasi_kali_wening"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: irigasi-backend
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-irigasi_kali_wening}
      DB_USER: ${DB_USER:-irigasi}
      DB_PASSWORD: ${DB_PASSWORD:-irigasi_dev_password}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    container_name: irigasi-frontend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"

  nginx:
    image: nginx:alpine
    container_name: irigasi-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  irigasi_db_data:
  frontend_node_modules:
